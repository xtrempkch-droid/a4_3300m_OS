# make.conf usado DENTRO do chroot do Catalyst (alvo: AMD A4-3300M).
# NÃO copie este arquivo para o host de build: as flags abaixo geram
# binários para a família 14h (Llano) e o runner do GitHub é outra CPU.
#
# IMPORTANTE: o Catalyst REESCREVE /etc/portage/make.conf em cada etapa e só
# preserva COMMON_FLAGS/CFLAGS/CXXFLAGS/FCFLAGS/FFLAGS lidos deste arquivo.
# USE, L10N, VIDEO_CARDS e INPUT_DEVICES ficam em catalyst/livecd-stage1.spec.in
# (chave livecd/use) e as licenças em portage/package.license/a4-target.

# Otimização nativa: btver1 = AMD Family 14h (Llano/Bobcat), SSE4A + ABM.
COMMON_FLAGS="-O2 -march=btver1 -mtune=btver1 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Paralelismo: o Catalyst ignora este MAKEOPTS e usa `jobs`/`load-average`
# de /etc/catalyst/catalyst.conf; mantido apenas como referência do alvo.
MAKEOPTS="-j4"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=6"

# L10N, VIDEO_CARDS, INPUT_DEVICES, ACCEPT_LICENSE e USE NÃO são lidos por
# este arquivo (ver aviso acima). Eles estão definidos em:
#   catalyst/livecd-stage1.spec.in  -> livecd/use (USE + USE_EXPAND)
#   portage/package.license/        -> licenças
#   portage/package.use/            -> exceções por pacote
