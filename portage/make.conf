# portage/make.conf
# Otimizado especificamente para a arquitetura do AMD A4-3300M

COMMON_FLAGS="-O2 -march=btver1 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Usa 4 núcleos virtuais na compilação do GitHub Actions para acelerar o processo
MAKEOPTS="-j4"

# Idioma, Teclado e Plataforma de Inicialização
LC_MESSAGES=C.UTF-8
GRUB_PLATFORMS="efi-64 pc"

# Recursos de vídeo para a sua placa integrada Radeon HD 6480G
VIDEO_CARDS="radeon r600"

# FLAGS "USE": Habilita suporte a áudio, vídeo, aceleração gráfica e Flatpak.
# Remove o peso de ambientes modernos e pesados (-gnome -kde -systemd)
USE="X openrc alsa pulseaudio elogind vaapi vdpau mp3 mp4 mpeg avi flac vorbis ogg \
     truetype unicode jpeg png udev dbus policykit flatpak -gnome -kde -systemd"
