# make.conf usado DENTRO do chroot do Catalyst (alvo: AMD A4-3300M).
# NÃO copie este arquivo para o host de build: as flags abaixo geram
# binários para a família 14h (Llano) e o runner do GitHub é outra CPU.

# Otimização nativa: btver1 = AMD Family 14h (Llano/Bobcat), SSE4A + ABM.
COMMON_FLAGS="-O2 -march=btver1 -mtune=btver1 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Paralelismo do runner (4 vCPU) e do alvo.
MAKEOPTS="-j4"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=6"

# Traduções dos pacotes que suportam L10N (Firefox, LibreOffice, Kodi...).
L10N="pt-BR"

# Driver de vídeo da Radeon HD 6480G (Llano/Sumo, geração r600/NI).
VIDEO_CARDS="radeon r600"
INPUT_DEVICES="libinput"

# Firmware, codecs, Firefox-bin, etc.
ACCEPT_LICENSE="*"

# USE mínimo para mídia/escritório/internet, sem GNOME/KDE/systemd/Wayland.
USE="X alsa pulseaudio elogind vaapi vdpau \
     mp3 mp4 mpeg flac vorbis ogg \
     truetype unicode jpeg png udev dbus policykit \
     -gnome -kde -systemd -wayland -bluetooth"
