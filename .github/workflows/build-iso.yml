name: Gerar ISO Gentoo Customizada (AMD A4-3300M)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'portage/**'
      - 'catalyst/**'
      - 'overlay/**'
      - 'scripts/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION_STAMP: R1
  # O stage1 completo tem 471 pacotes (~11 h num runner de 4 vCPU), mais do que
  # o limite de 355 min de um job. O build é incremental via binpkg cache, então
  # cada execução avança um pedaço e o stage2 roda em um job separado assim que
  # o stage1 termina.
  STAGE1_TIMEOUT: '16200'
  STAGE2_TIMEOUT: '3000'

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    container:
      image: gentoo/stage3:amd64-openrc
      options: --privileged
    outputs:
      complete: ${{ steps.build.outputs.complete }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Podar caches antigos
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def call(path, method="GET"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              return urllib.request.urlopen(req).read()

          try:
              data = json.loads(call("/actions/caches?per_page=100"))
          except Exception as exc:  # noqa: BLE001
              print(f"aviso: não foi possível listar caches: {exc}")
              raise SystemExit(0)

          # Cada execução salva uma entrada nova (o cache do GitHub é imutável).
          # Sem esta poda o repositório estouraria o limite de 10 GB.
          caches = data.get("actions_caches", [])
          for prefix in ("binpkgs-", "stage1-out-", "distfiles-"):
              group = [c for c in caches if c["key"].startswith(prefix)]
              group.sort(key=lambda c: c["created_at"], reverse=True)
              for cache in group[1:]:
                  try:
                      call(f"/actions/caches/{cache['id']}", method="DELETE")
                      print(f"removido: {cache['key']}")
                  except Exception as exc:  # noqa: BLE001
                      print(f"aviso ao remover {cache['key']}: {exc}")
              print(f"{prefix}* mantidos: {min(len(group), 1)}")
          PY

      - name: Restaurar binpkgs (build incremental)
        id: cache_binpkgs
        uses: actions/cache/restore@v4
        with:
          path: /var/tmp/catalyst/packages
          key: binpkgs-${{ github.run_id }}
          restore-keys: |
            binpkgs-

      - name: Restaurar distfiles
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/distfiles
          key: distfiles-${{ hashFiles('catalyst/**', 'portage/**', 'scripts/**') }}
          restore-keys: |
            distfiles-

      - name: Preparar o Catalyst no container de build
        run: ./scripts/prepare-catalyst.sh

      - name: Diagnóstico antes do build
        run: |
          df -h / /var/tmp
          echo "--- binpkgs restaurados ---"
          find /var/tmp/catalyst/packages -name '*.gpkg.tar' 2>/dev/null | wc -l
          du -sh /var/tmp/catalyst/packages /var/cache/distfiles 2>/dev/null || true
          echo "--- catalyst.conf efetivo ---"
          grep -nE 'options|jobs|load-average' -A6 /etc/catalyst/catalyst.conf | head -40

      - name: Gerar livecd-stage1 (pacotes)
        id: build
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ./scripts/build-iso.sh stage1; then
            echo "complete=true" >> "${GITHUB_OUTPUT}"
          else
            echo "complete=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Salvar binpkgs
        if: always() && steps.cache_binpkgs.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /var/tmp/catalyst/packages
          key: ${{ steps.cache_binpkgs.outputs.cache-primary-key }}

      - name: Salvar distfiles
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /var/cache/distfiles
          key: distfiles-${{ hashFiles('catalyst/**', 'portage/**', 'scripts/**') }}

      - name: Salvar artefato do stage1 (seed do stage2)
        if: steps.build.outputs.complete == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /var/tmp/catalyst/builds
            /var/tmp/catalyst/snapshots
            /var/tmp/catalyst/.snapshot-sha
          key: stage1-out-${{ github.run_id }}

      - name: Upload dos logs do Catalyst
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-logs-stage1
          path: |
            /var/tmp/catalyst/logs/**
            /tmp/livecd-stage1.spec
            /etc/catalyst/catalyst.conf
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar log da falha (branch build-logs)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-failure-log.sh stage1

  stage2:
    needs: stage1
    if: needs.stage1.result == 'success' && needs.stage1.outputs.complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    container:
      image: gentoo/stage3:amd64-openrc
      options: --privileged

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Restaurar artefato do stage1
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/tmp/catalyst/builds
            /var/tmp/catalyst/snapshots
            /var/tmp/catalyst/.snapshot-sha
          key: stage1-out-${{ github.run_id }}
          restore-keys: |
            stage1-out-

      - name: Restaurar distfiles
        uses: actions/cache/restore@v4
        with:
          path: /var/cache/distfiles
          key: distfiles-${{ hashFiles('catalyst/**', 'portage/**', 'scripts/**') }}
          restore-keys: |
            distfiles-

      - name: Preparar o Catalyst no container de build
        run: ./scripts/prepare-catalyst.sh

      - name: Gerar livecd-stage2 (kernel + ISO)
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: ./scripts/build-iso.sh stage2

      - name: Upload dos logs do Catalyst
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-logs-stage2
          path: |
            /var/tmp/catalyst/logs/**
            /tmp/livecd-stage2.spec
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar log da falha (branch build-logs)
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-failure-log.sh stage2

      - name: Upload da ISO pronta
        uses: actions/upload-artifact@v4
        with:
          name: Gentoo-A4-Media-ISO
          path: |
            /var/tmp/catalyst/builds/default/gentoo-a4-media-*.iso
            /var/tmp/catalyst/builds/default/gentoo-a4-media-*.iso.DIGESTS
          retention-days: 5
          if-no-files-found: error
