name: Gerar ISO Gentoo Customizada (AMD A4-3300M)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-iso.yml'
      - 'portage/**'
      - 'catalyst/**'
      - 'overlay/**'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    container:
      image: gentoo/stage3:amd64-openrc
      options: --privileged
    env:
      VERSION_STAMP: R1
      # Tempo máximo de cada etapa do Catalyst. Fica abaixo do timeout do job
      # para que o cache de binários seja salvo mesmo quando a etapa estoura.
      STAGE1_TIMEOUT: '15600'
      STAGE2_TIMEOUT: '2700'

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Restaurar cache de build (binpkgs, distfiles, snapshots)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/tmp/catalyst/packages
            /var/tmp/catalyst/snapshots
            /var/cache/distfiles
          key: catalyst-${{ hashFiles('catalyst/**', 'portage/**', 'scripts/**') }}
          restore-keys: |
            catalyst-

      - name: Preparar o Catalyst no container de build
        run: |
          set -euo pipefail
          mkdir -p /etc/portage/package.accept_keywords /etc/portage/package.use
          mkdir -p /etc/portage/binrepos.conf

          # Binhost oficial: as ferramentas do HOST (catalyst, grub, genkernel)
          # são genéricas e não precisam de -march=btver1. Usar binpkgs aqui
          # evita ~20 min de compilação por execução. O chroot do alvo NÃO usa
          # este binhost (catalyst só escreve binrepos.conf se "binhost"
          # estiver definido em catalyst.conf).
          cat > /etc/portage/binrepos.conf/gentoo.conf <<'EOF'
          [gentoo]
          priority = 9999
          sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
          verify-signature = false
          EOF

          emerge-webrsync

          # O Catalyst só é publicado como ~amd64 no repositório oficial.
          echo 'dev-util/catalyst ~amd64' > /etc/portage/package.accept_keywords/catalyst

          # GRUB do host precisa gerar ISO bootável em BIOS e UEFI.
          cat >> /etc/portage/make.conf <<'EOF'
          GRUB_PLATFORMS="efi-32 efi-64 pc"
          MAKEOPTS="-j4"
          EMERGE_DEFAULT_OPTS="--jobs=4 --load-average=8"
          EOF

          # USE exigidas por dependências do Catalyst (o emerge abortaria com
          # "The following USE changes are necessary to proceed").
          echo '>=sys-apps/util-linux-2.42.3 python' > /etc/portage/package.use/catalyst

          emerge --oneshot --getbinpkg --usepkg \
            --autounmask-write=y --autounmask-continue=y \
            dev-util/catalyst sec-keys/openpgp-keys-gentoo-release app-crypt/gnupg

          # CRÍTICO: sem "jobs" o Catalyst define MAKEOPTS="" e o emerge dentro
          # do chroot compila em série (-j1), o que estoura o tempo do runner.
          # (var_tmpfs_portage fica desligado de propósito: 8 GB de tmpfs num
          # runner de 16 GB pode causar OOM durante llvm/mesa/kodi.)
          cat >> /etc/catalyst/catalyst.conf <<'EOF'

          jobs = 4
          load-average = 6.0
          port_logdir = "/var/tmp/catalyst/logs"
          EOF

          mkdir -p /var/tmp/catalyst/logs

      - name: Diagnóstico de espaço em disco
        run: |
          df -h / /var/tmp 2>/dev/null || df -h /
          echo "--- cache de binpkgs restaurado ---"
          find /var/tmp/catalyst/packages -name '*.gpkg.tar' 2>/dev/null | wc -l

      - name: Gerar a ISO (stage3 + snapshot + stage1 + stage2)
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: ./scripts/build-iso.sh

      - name: Salvar cache de build
        if: always() && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /var/tmp/catalyst/packages
            /var/tmp/catalyst/snapshots
            /var/cache/distfiles
          # O limite do GitHub é 10 GB por entrada de cache; se estourar, o
          # passo falha de forma silenciosa (continue-on-error acima).
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload dos logs do Catalyst
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-logs
          path: |
            /var/tmp/catalyst/logs/**
            /tmp/livecd-stage*.spec
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar log da falha (branch build-logs)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cd "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          mkdir -p .build-logs
          {
            echo "run: ${GITHUB_RUN_ID}  commit: ${GITHUB_SHA}"
            echo "=== resumo dos binpkgs ==="
            find /var/tmp/catalyst/packages -name '*.gpkg.tar' 2>/dev/null | wc -l
            echo "=== logs do catalyst ==="
            for f in /var/tmp/catalyst/logs/*; do
              [ -f "$f" ] || continue
              echo "----- $f (ultimas 200 linhas) -----"
              tail -n 200 "$f"
            done
          } > .build-logs/last-failure.log 2>&1
          cp /tmp/livecd-stage1.spec /tmp/livecd-stage2.spec .build-logs/ 2>/dev/null || true
          git checkout -B build-logs
          git add -f .build-logs
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "log: falha no run ${GITHUB_RUN_ID}" || true
          git push -f origin HEAD:build-logs

      - name: Upload da ISO pronta
        uses: actions/upload-artifact@v4
        with:
          name: Gentoo-A4-Media-ISO
          path: |
            /var/tmp/catalyst/builds/default/gentoo-a4-media-*.iso
            /var/tmp/catalyst/builds/default/gentoo-a4-media-*.iso.DIGESTS
          retention-days: 5
          if-no-files-found: error
