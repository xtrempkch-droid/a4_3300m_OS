# SLiM: login leve com autologin no usuário do livecd.
# Arquivo instalado em /etc/slim.conf pelo root_overlay do Catalyst.

default_path        /usr/local/bin:/usr/bin:/bin
default_xserver     /usr/bin/X
xserver_arguments   -nolisten tcp -dpi 96 vt07

xauth_path          /usr/bin/xauth
authfile            /run/slim.auth

halt_cmd            /sbin/shutdown -h now
reboot_cmd          /sbin/shutdown -r now
console_cmd         /usr/bin/xterm -C -fg white -bg black +sb -T "Console" -e /bin/sh

login_cmd           exec /bin/sh -l ~/.xinitrc
sessiondir          /etc/X11/Sessions

daemon              yes
lockfile            /run/slim.pid
logfile             /var/log/slim.log

current_theme       default
welcome_msg         Bem-vindo ao A4 Media OS

# Autologin: a sessão do livecd não pede senha.
default_user        a4
auto_login          yes
focus_password      no

numlock             on
